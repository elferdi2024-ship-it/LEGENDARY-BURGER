<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Legendary Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#080808;
  --coal:#101010;
  --card:#151515;
  --line:rgba(245,230,200,.16);
  --cream:#f5e6c8;
  --muted:#bcb4a7;
  --orange:#f05a22;
  --orange-dark:#c94213;
  --wa-green:#25D366;
  --display:"Archivo Black", sans-serif;
  --body:"Space Grotesk", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background: var(--ink);
  color:#fff;
  font-family:var(--body);
  padding: 40px 20px;
}
.admin-container { max-width: 1200px; margin: 0 auto; }
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:20px}
.admin-item{background:#111;border:1px solid var(--line);padding:15px;border-radius:8px;display:flex;gap:15px;align-items:center}
.admin-item img{width:60px;height:60px;border-radius:6px;object-fit:cover}
.admin-controls{margin-left:auto;display:flex;flex-direction:column;gap:5px}
.admin-btn{padding:6px 10px;font-size:11px;background:var(--orange);color:#111;font-weight:900;border-radius:4px;text-transform:uppercase; border:none; cursor:pointer;}
.admin-btn.del{background:#dc2626;color:#fff}
.admin-login{max-width:400px;margin:100px auto;text-align:center;padding:40px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.admin-form{display:grid;gap:15px;margin-top:20px}
.admin-form input, .admin-form select{width:100%;padding:12px;background:#080808;border:1px solid var(--line);color:#fff;border-radius:8px; font-size: 16px;}
.btn-primary{background:var(--orange);color:#111;padding:12px;border-radius:8px;font-weight:900;text-transform:uppercase;border:none;cursor:pointer;width:100%;}
.btn-outline{border:1px solid var(--line);padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;}
.toast{
  position:fixed;z-index:100;left:18px;right:18px;bottom:18px;padding:14px 16px;
  border-radius:8px;background:var(--cream);color:#111;font-weight:900;text-align:center;
  box-shadow:5px 5px 0 #000;transform:translateY(150%);transition:.22s;
}
.toast.show{transform:translateY(0)}
h1, h2, h3 { font-family: var(--display); margin-bottom: 10px; }
.mark{width:78px;height:6px;background:var(--orange);box-shadow:4px 4px 0 #000;margin-bottom:14px}
</style>
</head>
<body>
<div class="admin-container">
  <div id="adminLogin" class="admin-login">
    <div class="mark" style="margin: 0 auto 20px;"></div>
    <h2>Acceso Admin</h2>
    <div class="admin-form">
      <input type="password" id="adminPass" placeholder="Contraseña">
      <button onclick="loginAdmin()" class="btn-primary">Entrar</button>
    </div>
  </div>

  <div id="adminDashboard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
      <div>
        <div class="mark"></div>
        <h1>Panel de Control</h1>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="/" class="btn-outline">Ver Web</a>
        <button onclick="logoutAdmin()" class="btn-outline">Salir</button>
      </div>
    </div>

    <div id="adminMenu" class="admin-card" style="display:flex;gap:15px;overflow-x:auto;padding:15px">
      <button onclick="setView('products')" class="admin-btn">🍔 Productos</button>
      <button onclick="setView('categories')" class="admin-btn">📂 Categorías</button>
      <button onclick="setView('builder')" class="admin-btn">🛠️ Builder</button>
      <button onclick="setView('config')" class="admin-btn">⚙️ Config</button>
    </div>

    <div id="view-products">
      <div class="admin-card">
        <h3>Nuevo Producto</h3>
        <div class="admin-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px">
          <select id="newProdCat"></select>
          <input type="text" id="newProdName" placeholder="Nombre">
          <input type="number" id="newProdPrice" placeholder="Precio">
          <button onclick="addNewProduct()" class="btn-primary" style="height:46px; padding:0;">Añadir</button>
        </div>
      </div>
      <div id="adminList"></div>
    </div>

    <div id="view-categories" style="display:none">
      <div class="admin-card">
        <h3>Gestionar Categorías</h3>
        <div class="admin-form" style="display:grid;grid-template-columns:1fr auto;gap:15px">
          <input type="text" id="newCatName" placeholder="Nueva Categoría">
          <button onclick="addNewCategory()" class="btn-primary">Añadir</button>
        </div>
        <div id="categoryList" style="margin-top:20px"></div>
      </div>
    </div>

    <div id="view-builder" style="display:none">
      <div class="admin-card">
        <h3>Opciones del Builder</h3>
        <p style="font-size:12px;margin-bottom:10px;color:var(--muted)">Edita las opciones que aparecen en el personalizador.</p>
        <div id="builderList"></div>
      </div>
    </div>

    <div id="view-config" style="display:none">
      <div class="admin-card">
        <h3>Configuración del Sitio</h3>
        <div class="admin-form">
          <div class="form-field">
            <label>WhatsApp (ej: 59899123456)</label>
            <input type="text" id="confWA" placeholder="Número de WhatsApp">
          </div>
          <button onclick="saveConfig()" class="btn-primary">Guardar Configuración</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dwgwbnalrbzvakzbiwmb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3Z3dibmFscmJ6dmFremJpd21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTQ4OTEsImV4cCI6MjA5MzI5MDg5MX0.im55Wn6fWcQddwaiRgZx1umKYPI2y0fwW0_RuP51ZR0';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isAdmin = sessionStorage.getItem('is-legend-admin') === 'true';
let currentView = 'products';
let cats = [];
let prods = [];

const $=s=>document.querySelector(s);
function esc(t){ if(!t)return ''; return t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

function loginAdmin(){
  if($('#adminPass').value === 'admin123'){
    isAdmin=true; sessionStorage.setItem('is-legend-admin','true'); initAdmin();
  } else { toast('Contraseña incorrecta'); }
}

function logoutAdmin(){ isAdmin=false; sessionStorage.removeItem('is-legend-admin'); location.reload(); }

function setView(view){
  currentView = view;
  ['products','categories','builder','config'].forEach(v => {
    $(`#view-${v}`).style.display = v === view ? 'block' : 'none';
  });
  renderView();
}

async function initAdmin() {
  if(!isAdmin) return renderLogin();
  const { data: catData } = await supabase.from('categories').select('*').order('display_order');
  const { data: prodData } = await supabase.from('products').select('*');
  const { data: configData } = await supabase.from('site_config').select('*');

  cats = catData || [];
  prods = prodData || [];
  
  if(configData) {
    const wa = configData.find(c => c.key === 'whatsapp');
    if(wa) $('#confWA').value = wa.value;
  }

  $('#newProdCat').innerHTML = cats.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  renderView();
}

function renderLogin(){
  $('#adminLogin').style.display = 'block';
  $('#adminDashboard').style.display = 'none';
}

function renderView(){
  $('#adminLogin').style.display = 'none';
  $('#adminDashboard').style.display = 'block';

  if(currentView === 'products') renderProducts();
  if(currentView === 'categories') renderCategories();
  // Builder rendering omitted for brevity in MVP but logic exists
}

function renderProducts(){
  let html = '';
  cats.forEach(cat => {
    const catProds = prods.filter(p => p.category_id === cat.id);
    html += `<div class="admin-card"><h3>${cat.label}</h3><div class="admin-grid">`;
    catProds.forEach(item => {
      const firstImg = item.imgs?.[0] || item.img || '';
      html += `
        <div class="admin-item">
          <img src="${firstImg}" onerror="this.src='https://via.placeholder.com/60?text=LB'">
          <div>
            <strong>${esc(item.name)}</strong><br>
            <span style="color:var(--orange)">$${item.price}</span>
          </div>
          <div class="admin-controls">
            <button class="admin-btn" onclick="editProduct('${item.id}')">Editar</button>
            <button class="admin-btn del" onclick="deleteProduct('${item.id}')">Borrar</button>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });
  $('#adminList').innerHTML = html;
}

function renderCategories(){
  $('#categoryList').innerHTML = cats.map(cat => `
    <div style="display:flex;justify-content:space-between;padding:10px;background:#111;margin-bottom:5px;border-radius:6px;border:1px solid var(--line)">
      <span>${cat.label}</span>
      <button onclick="deleteCategory('${cat.id}')" style="color:#dc2626;font-size:12px;font-weight:700">ELIMINAR</button>
    </div>
  `).join('');
}

async function editProduct(id){
  const item = prods.find(p => p.id === id);
  const newPrice = prompt('Nuevo Precio:', item.price);
  if(newPrice === null) return;
  const newName = prompt('Nuevo Nombre:', item.name);
  if(newName === null) return;

  await supabase.from('products').update({ price: parseFloat(newPrice), name: newName }).eq('id', id);
  toast('Actualizado!');
  initAdmin();
}

async function deleteProduct(id){
  if(!confirm('¿Borrar?')) return;
  await supabase.from('products').delete().eq('id', id);
  initAdmin();
}

async function addNewProduct(){
  const category_id = $('#newProdCat').value;
  const name = $('#newProdName').value.trim();
  const price = parseFloat($('#newProdPrice').value);
  if(!name || isNaN(price)) return toast('Completa datos');
  
  const id = name.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now();
  await supabase.from('products').insert({ id, category_id, name, price, description: 'Nuevo producto' });
  $('#newProdName').value = ''; $('#newProdPrice').value = '';
  initAdmin();
  toast('Producto añadido!');
}

async function saveConfig(){
  const wa = $('#confWA').value.trim();
  await supabase.from('site_config').upsert({ key: 'whatsapp', value: wa });
  toast('Configuración guardada!');
}

function toast(text){
  const el=$('#toast');
  el.textContent=text;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

initAdmin();
</script>
</body>
</html>
