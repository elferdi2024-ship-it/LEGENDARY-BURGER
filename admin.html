<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Legendary Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#080808;
  --coal:#101010;
  --card:#151515;
  --line:rgba(245,230,200,.16);
  --cream:#f5e6c8;
  --muted:#bcb4a7;
  --orange:#f05a22;
  --orange-dark:#c94213;
  --wa-green:#25D366;
  --display:"Archivo Black", sans-serif;
  --body:"Space Grotesk", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background: var(--ink);
  color:#fff;
  font-family:var(--body);
  padding: 40px 20px;
}
.admin-container { max-width: 1200px; margin: 0 auto; }
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:20px}
.admin-item{background:#111;border:1px solid var(--line);padding:15px;border-radius:8px;display:flex;gap:15px;align-items:center}
.admin-item img{width:60px;height:60px;border-radius:6px;object-fit:cover}
.admin-controls{margin-left:auto;display:flex;flex-direction:column;gap:5px}
.admin-btn{padding:6px 12px;font-size:11px;background:var(--orange);color:#111;font-weight:900;border-radius:4px;text-transform:uppercase; border:none; cursor:pointer;}
.admin-btn.del{background:#dc2626;color:#fff}
.admin-btn.secondary{background:#333;color:#fff}
.admin-login{max-width:400px;margin:100px auto;text-align:center;padding:40px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.admin-form{display:grid;gap:15px;margin-top:20px}
.admin-form input, .admin-form select{width:100%;padding:12px;background:#080808;border:1px solid var(--line);color:#fff;border-radius:8px; font-size: 16px;}
.btn-primary{background:var(--orange);color:#111;padding:12px;border-radius:8px;font-weight:900;text-transform:uppercase;border:none;cursor:pointer;width:100%;}
.btn-outline{border:1px solid var(--line);padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;background:transparent;color:#fff;text-decoration:none;display:inline-block;}
.toast{
  position:fixed;z-index:100;left:50%;bottom:30px;transform:translateX(-50%) translateY(150%);
  padding:14px 24px;border-radius:12px;background:var(--cream);color:#111;font-weight:900;
  text-align:center;box-shadow:5px 5px 0 #000;transition:.3s;
}
.toast.show{transform:translateX(-50%) translateY(0)}
h1, h2, h3 { font-family: var(--display); margin-bottom: 10px; }
.mark{width:78px;height:6px;background:var(--orange);box-shadow:4px 4px 0 #000;margin-bottom:14px}
.builder-step-admin{border-bottom:1px solid var(--line);padding:15px 0}
.builder-option-admin{display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#111;padding:8px;border-radius:6px}
</style>
</head>
<body>
<div class="admin-container">
  <div id="adminLogin" class="admin-login">
    <div class="mark" style="margin: 0 auto 20px;"></div>
    <h2>Acceso Admin</h2>
    <div class="admin-form">
      <input type="password" id="adminPass" placeholder="Contraseña">
      <button onclick="loginAdmin()" class="btn-primary">Entrar</button>
    </div>
  </div>

  <div id="adminDashboard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
      <div>
        <div class="mark"></div>
        <h1>Legendary Panel</h1>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="/" class="btn-outline">Ver Web</a>
        <button onclick="logoutAdmin()" class="btn-outline">Salir</button>
      </div>
    </div>

    <div class="admin-card" style="display:flex;gap:10px;overflow-x:auto;padding:10px;background:#000">
      <button onclick="setView('products')" class="admin-btn">🍔 Productos</button>
      <button onclick="setView('builder')" class="admin-btn">🛠️ Builder</button>
      <button onclick="setView('categories')" class="admin-btn">📂 Categorías</button>
      <button onclick="setView('config')" class="admin-btn">⚙️ Config</button>
    </div>

    <div id="view-products" class="view-section">
      <div class="admin-card">
        <h3>Nuevo Producto</h3>
        <div class="admin-form" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px">
          <select id="newProdCat"></select>
          <input type="text" id="newProdName" placeholder="Nombre">
          <input type="number" id="newProdPrice" placeholder="Precio">
          <button onclick="addNewProduct()" class="btn-primary" style="height:46px; padding:0;">Añadir</button>
        </div>
      </div>
      <div id="adminList"></div>
    </div>

    <div id="view-builder" class="view-section" style="display:none">
      <div class="admin-card">
        <h3>Gestionar Armador (Builder)</h3>
        <div id="builderAdminList"></div>
      </div>
    </div>

    <div id="view-categories" class="view-section" style="display:none">
      <div class="admin-card">
        <h3>Categorías</h3>
        <div class="admin-form" style="display:grid;grid-template-columns:1fr auto;gap:15px">
          <input type="text" id="newCatName" placeholder="Nueva Categoría">
          <button onclick="addNewCategory()" class="btn-primary">Añadir</button>
        </div>
        <div id="categoryList" style="margin-top:20px"></div>
      </div>
    </div>

    <div id="view-config" class="view-section" style="display:none">
      <div class="admin-card">
        <h3>Configuración General</h3>
        <div class="admin-form">
          <label>WhatsApp Pedidos (Número completo sin +)</label>
          <input type="text" id="confWA" placeholder="59899000000">
          <label>Precio de Envío ($)</label>
          <input type="number" id="confDelivery" placeholder="100">
          <button onclick="saveConfig()" class="btn-primary">Guardar Todo</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dwgwbnalrbzvakzbiwmb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3Z3dibmFscmJ6dmFremJpd21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTQ4OTEsImV4cCI6MjA5MzI5MDg5MX0.im55Wn6fWcQddwaiRgZx1umKYPI2y0fwW0_RuP51ZR0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isAdmin = sessionStorage.getItem('is-legend-admin') === 'true';
let currentView = 'products';
let cats = [];
let prods = [];
let bSteps = [];

const $=s=>document.querySelector(s);
const esc=t=>t?t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'):'';

function loginAdmin(){
  if($('#adminPass').value === 'admin123'){
    isAdmin=true; sessionStorage.setItem('is-legend-admin','true'); initAdmin();
  } else { toast('Contraseña incorrecta'); }
}
function logoutAdmin(){ isAdmin=false; sessionStorage.removeItem('is-legend-admin'); location.reload(); }

function setView(view){
  currentView = view;
  $$('.view-section').forEach(v => v.style.display = 'none');
  $(`#view-${view}`).style.display = 'block';
  renderView();
}
const $$=s=>Array.from(document.querySelectorAll(s));

async function initAdmin() {
  if(!isAdmin) return;
  $('#adminLogin').style.display = 'none';
  $('#adminDashboard').style.display = 'block';

  const { data: catData } = await sb.from('categories').select('*').order('display_order');
  const { data: prodData } = await sb.from('products').select('*').order('created_at',{ascending:false});
  const { data: configData } = await sb.from('site_config').select('*');
  const { data: builderData } = await sb.from('builder_options').select('*').order('display_order');

  cats = catData || [];
  prods = prodData || [];
  bSteps = builderData || [];
  
  if(configData) {
    const wa = configData.find(c => c.key === 'wa_number');
    const del = configData.find(c => c.key === 'delivery_price');
    if(wa) $('#confWA').value = wa.value;
    if(del) $('#confDelivery').value = del.value;
  }

  $('#newProdCat').innerHTML = cats.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  renderView();
}

function renderView(){
  if(currentView === 'products') renderProducts();
  if(currentView === 'builder') renderBuilderAdmin();
  if(currentView === 'categories') renderCategories();
}

function renderProducts(){
  let html = '';
  cats.forEach(cat => {
    const catProds = prods.filter(p => p.category_id === cat.id);
    html += `<div class="admin-card"><h3>${cat.label}</h3><div class="admin-grid">`;
    catProds.forEach(p => {
      html += `
        <div class="admin-item">
          <img src="${p.img || ''}" onerror="this.src='https://via.placeholder.com/60?text=LB'">
          <div style="flex:1">
            <strong>${esc(p.name)}</strong><br>
            <span style="color:var(--orange)">$${p.price}</span>
          </div>
          <div class="admin-controls">
            <button class="admin-btn" onclick="editProduct('${p.id}')">EDITAR</button>
            <button class="admin-btn del" onclick="deleteProduct('${p.id}')">X</button>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });
  $('#adminList').innerHTML = html;
}

function renderBuilderAdmin(){
  let html = '';
  bSteps.forEach(step => {
    html += `<div class="builder-step-admin">
      <h3>${step.label} ${step.is_multi ? '(Múltiple)' : ''}</h3>
      <div id="opts-${step.id}">
        ${step.options.map((opt, i) => `
          <div class="builder-option-admin">
            <span style="width:30px;font-weight:900;color:var(--orange)">${opt.code}</span>
            <input type="text" value="${opt.name}" onchange="updateBuilderOpt('${step.id}', ${i}, 'name', this.value)" style="flex:1;padding:5px">
            <input type="number" value="${opt.price}" onchange="updateBuilderOpt('${step.id}', ${i}, 'price', this.value)" style="width:80px;padding:5px">
            <button class="admin-btn del" onclick="removeBuilderOpt('${step.id}', ${i})">X</button>
          </div>
        `).join('')}
      </div>
      <button class="admin-btn" onclick="addBuilderOpt('${step.id}')">+ Añadir Opción</button>
    </div>`;
  });
  $('#builderAdminList').innerHTML = html;
}

function renderCategories(){
  $('#categoryList').innerHTML = cats.map(cat => `
    <div style="display:flex;justify-content:space-between;padding:12px;background:#111;margin-bottom:8px;border-radius:8px;border:1px solid var(--line)">
      <span>${cat.label}</span>
      <button class="admin-btn del" onclick="deleteCategory('${cat.id}')">ELIMINAR</button>
    </div>
  `).join('');
}

// LÓGICA DE PRODUCTOS
async function editProduct(id){
  const p = prods.find(x => x.id === id);
  const n = prompt("Nuevo nombre:", p.name); if(!n) return;
  const pr = prompt("Nuevo precio:", p.price); if(!pr) return;
  const im = prompt("URL Imagen:", p.img || '');
  await sb.from('products').update({ name: n, price: parseFloat(pr), img: im }).eq('id', id);
  toast('Actualizado!'); initAdmin();
}
async function deleteProduct(id){
  if(confirm("¿Borrar?")) { await sb.from('products').delete().eq('id', id); initAdmin(); }
}
async function addNewProduct(){
  const cat = $('#newProdCat').value;
  const name = $('#newProdName').value;
  const price = parseFloat($('#newProdPrice').value);
  if(!name || isNaN(price)) return toast("Completa datos");
  const id = name.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now();
  await sb.from('products').insert({ id, category_id: cat, name, price, description: 'Nuevo' });
  initAdmin(); toast("Creado!");
}

// LÓGICA DE BUILDER
async function updateBuilderOpt(stepId, index, field, val){
  const step = bSteps.find(s => s.id === stepId);
  if(field === 'price') val = parseFloat(val);
  step.options[index][field] = val;
  await sb.from('builder_options').update({ options: step.options }).eq('id', stepId);
  toast("Opción guardada");
}
async function addBuilderOpt(stepId){
  const step = bSteps.find(s => s.id === stepId);
  step.options.push({ id: 'new-'+Date.now(), code: 'X', name: 'Nueva Opción', price: 0 });
  await sb.from('builder_options').update({ options: step.options }).eq('id', stepId);
  initAdmin();
}
async function removeBuilderOpt(stepId, index){
  if(!confirm("¿Quitar opción?")) return;
  const step = bSteps.find(s => s.id === stepId);
  step.options.splice(index, 1);
  await sb.from('builder_options').update({ options: step.options }).eq('id', stepId);
  initAdmin();
}

// CONFIG
async function saveConfig(){
  const wa = $('#confWA').value;
  const del = $('#confDelivery').value;
  await sb.from('site_config').upsert({ key: 'wa_number', value: wa });
  await sb.from('site_config').upsert({ key: 'delivery_price', value: del });
  toast("Configuración guardada");
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

initAdmin();
</script>
</body>
</html>
